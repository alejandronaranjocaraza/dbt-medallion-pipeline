snapshots:
  - name: odoo_scd2__product_product
    relation: ref('odoo_stg__product_product')
    description: "product_product SCD2 via write_date"
    config:
      schema: snapshots
      unique_key: id
      strategy: timestamp
      updated_at: write_date
