models:
  - name: odoo_fact__appointments
    columns:
      - name: appointment_id
        data_tests:
          - unique
          - not_null
      - name: doctor_key
        data_tests:
          - relationships:
              arguments:
                to: ref('odoo_dim__doctor')
                field: id
      - name: patient_key
        data_tests:
          - relationships:
              arguments:
                to: ref('odoo_dim__patient')
                field: id

  - name: odoo_fact__sales
    columns:
      - name: order_line_id
        data_tests:
          - unique
          - not_null
      - name: doctor_key
        data_tests:
          - relationships:
              arguments:
                to: ref('odoo_dim__doctor')
                field: id
      - name: patient_key
        data_tests:
          - relationships:
              arguments:
                to: ref('odoo_dim__patient')
                field: id
      - name: product_key
        data_tests:
          - relationships:
              arguments:
                to: ref('odoo_dim__product')
                field: id
      - name: company_key
        data_tests:
          - relationships:
              arguments:
                to: ref('odoo_dim__company')
                field: id
      - name: bu_key
        data_tests:
          - relationships:
              arguments:
                to: ref('odoo_dim__business_unit')
                field: id
